{% if show %}
<style>
  .history { margin-top:1rem; background:#fff; border:1px solid var(--line); border-radius:8px; padding:.9rem 1rem; max-width:720px; }
  .history h2 { font-size:1rem; margin:0 0 .5rem; display:flex; justify-content:space-between; } .history h2 a { font-weight:400; font-size:.85rem; }
  .history ul { list-style:none; margin:0; padding:0; } .history li { padding:.35rem 0; border-top:1px solid var(--line); font-size:.9rem; } .history li:first-child { border-top:0; }
  .history .meta { color:var(--muted); font-size:.8rem; }
</style>
<section class="history">
  <h2>History <a href="{% url 'activity_list' %}?object={{ object_key }}">full history →</a></h2>
  <ul>
    {% for e in entries %}
      <li>{{ e.summary }}{% if e.changes_label %}<br><span class="meta">{{ e.changes_label }}</span>{% endif %}
        <br><span class="meta">{{ e.actor_label }} · {{ e.created_at|date:"M j, Y g:i A" }}</span></li>
    {% empty %}<li class="meta">No recorded activity yet.</li>{% endfor %}
  </ul>
</section>
{% endif %}
